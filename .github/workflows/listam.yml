name: list.am watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay a few minutes)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: listam
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check list.am
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python listam_watcher.py --once
      - name: Save seen listings
        run: |
          git config user.name "listam-bot"
          git config user.email "listam-bot@users.noreply.github.com"
          git add seen_ids.json
          git diff --cached --quiet || (git commit -m "update seen listings" && git push)
